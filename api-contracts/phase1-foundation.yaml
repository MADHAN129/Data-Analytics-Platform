          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
  
  /audit/stats:
    get:
      tags: [Audit]
      summary: Get audit statistics
      description: Get audit log statistics and summaries (Admin only)
      operationId: getAuditStats
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: Stats from date
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: Stats to date
      responses:
        200:
          description: Audit statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_events:
                    type: integer
                    description: Total number of events
                    example: 15000
                  successful_events:
                    type: integer
                    description: Successful events
                    example: 14500
                  failed_events:
                    type: integer
                    description: Failed events
                    example: 500
                  unique_users:
                    type: integer
                    description: Unique users performing actions
                    example: 45
                  top_actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                          example: "login"
                        count:
                          type: integer
                          example: 5000
                  top_users:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                          example: 1
                        email:
                          type: string
                          example: "admin@company.com"
                        action_count:
                          type: integer
                          example: 250
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

# ============================================
# PATHS
# ============================================

paths:
  # ============================================
  # HEALTH ENDPOINTS
  # ============================================
  
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Check system health and service status
      operationId: healthCheck
      security: []
      responses:
        200:
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        503:
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  
  # ============================================
  # AUTHENTICATION ENDPOINTS
  # ============================================
  
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Create a new user account with email and password
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        409:
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Email already registered"
                error_code: "EMAIL_EXISTS"
  
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      description: Authenticate user with email and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Invalid email or password"
                error_code: "AUTH_INVALID_CREDENTIALS"
  
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Invalidate current session and tokens
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
  
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Obtain new access token using refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        401:
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: Send password reset email to user
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        200:
          description: Reset email sent (always returns success for security)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: "If the email exists, a reset link has been sent"
  
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password
      description: Reset user password using token from email
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        200:
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        400:
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: Change password for authenticated user
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        200:
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        401:
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  # ============================================
  # USER ENDPOINTS
  # ============================================
  
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Get authenticated user's profile information
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
    
    put:
      tags: [Users]
      summary: Update current user profile
      description: Update authenticated user's profile information
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/Unauthorized'
  
  /users:
    get:
      tags: [Users]
      summary: List all users
      description: Get paginated list of all users (Admin only)
      operationId: listUsers
      security:
