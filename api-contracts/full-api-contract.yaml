openapi: 3.1.0
info:
  title: Agentic Analytics Platform - Full API Contract
  description: |
    Complete API contract for the Agentic Analytics Platform.
    Covers Phase 1 (Foundation) through Phase 8 (API Integration).

    ## Authentication
    - JWT Bearer token authentication
    - OAuth2/OIDC support (Azure AD, Google)
    - API Key authentication for programmatic access
    - Token refresh mechanism

    ## Authorization
    - Role-Based Access Control (RBAC)
    - Permission-based resource access
    - Predefined roles: SuperAdmin, Admin, Analyst, Viewer, DataManager

    ## Real-time Features
    - WebSocket endpoints for voice, queries, notifications, and live dashboards

    ## Rate Limiting
    - Per-user and per-API-key rate limiting
    - Configurable limits per endpoint group
  version: 2.0.0
  contact:
    name: API Support
    email: support@agentic-analytics.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.agentic-analytics.com/api/v1
    description: Production server

tags:
  - name: Health
    description: System health checks
  - name: Authentication
    description: User authentication and token management
  - name: Users
    description: User profile and management operations
  - name: Roles
    description: Role management for RBAC
  - name: Permissions
    description: Permission management and assignment
  - name: Audit
    description: Audit logging and history
  - name: Databases
    description: Database connection management via MCP
  - name: Queries
    description: Natural language and SQL query execution
  - name: Conversations
    description: Conversational context and follow-ups
  - name: Dashboards
    description: Dashboard management and auto-generation
  - name: Voice
    description: Speech-to-text and text-to-speech
  - name: Anomaly
    description: Anomaly detection and alerting
  - name: Predictions
    description: Predictive analytics and forecasting
  - name: CSV Import
    description: CSV file upload and import
  - name: Exports
    description: Report and data export (PDF, Excel, PNG)
  - name: Integrations
    description: Third-party integration management
  - name: API Keys
    description: API key management for programmatic access

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register

    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            openid: OpenID Connect
            profile: User profile
            email: User email

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for programmatic access

  schemas:
    # ============================================
    # COMMON SCHEMAS
    # ============================================

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: "Invalid credentials"
        error_code:
          type: string
          description: Machine-readable error code
          example: "AUTH_INVALID_CREDENTIALS"
        metadata:
          type: object
          nullable: true
          description: Additional error context

    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected]
            redis:
              type: string
              enum: [connected, disconnected]
            llm:
              type: string
              enum: [ready, loading, error]

    PaginationParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

    # ============================================
    # PHASE 1: AUTH SCHEMAS
    # ============================================

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          example: "john.doe@company.com"
        password:
          type: string
          minLength: 8
          example: "SecurePass123!"
        full_name:
          type: string
          minLength: 2
          example: "John Doe"
        phone:
          type: string
          example: "+1-555-123-4567"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        remember_me:
          type: boolean
          default: false

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8

    OAuthCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string

    # ============================================
    # PHASE 1: USER SCHEMAS
    # ============================================

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        auth_provider:
          type: string
          enum: [local, azure_ad, google]
        is_active:
          type: boolean
        mfa_enabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 2
        phone:
          type: string
        avatar_url:
          type: string
          format: uri

    CreateUserRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        phone:
          type: string
        role_ids:
          type: array
          items:
            type: integer

    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        pages:
          type: integer

    # ============================================
    # PHASE 1: ROLE SCHEMAS
    # ============================================

    RoleResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
        user_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 200
        permission_ids:
          type: array
          items:
            type: integer

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        description:
          type: string
          maxLength: 200
        permission_ids:
          type: array
          items:
            type: integer

    RoleListResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        total:
          type: integer

    # ============================================
    # PHASE 1: PERMISSION SCHEMAS
    # ============================================

    PermissionResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    PermissionListResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
        total:
          type: integer

    # ============================================
    # PHASE 1: AUDIT SCHEMAS
    # ============================================

    AuditLogResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_email:
          type: string
          format: email
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
        status:
          type: string
          enum: [success, failure]
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    # ============================================
    # PHASE 2: DATABASE SCHEMAS
    # ============================================

    DatabaseConnectionRequest:
      type: object
      required: [name, type, host, port, database_name]
      properties:
        name:
          type: string
          example: "Production PostgreSQL"
        type:
          type: string
          enum: [postgresql, mysql, sqlserver, mongodb, oracle, snowflake, bigquery, sqlite]
        host:
          type: string
          example: "db.company.com"
        port:
          type: integer
          example: 5432
        database_name:
          type: string
          example: "erp_production"
        schema_name:
          type: string
          default: "public"
        username:
          type: string
        password:
          type: string
        ssl:
          type: boolean
          default: false
        pool_size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 30

    DatabaseResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [postgresql, mysql, sqlserver, mongodb, oracle, snowflake, bigquery, sqlite]
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        schema_name:
          type: string
        status:
          type: string
          enum: [connected, disconnected, error, syncing]
        is_active:
          type: boolean
        schema_summary:
          type: object
          nullable: true
          properties:
            tables:
              type: integer
            views:
              type: integer
            columns:
              type: integer
        last_sync_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DatabaseListResponse:
      type: object
      properties:
        databases:
          type: array
          items:
            $ref: '#/components/schemas/DatabaseResponse'
        total:
          type: integer

    DatabaseTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        latency_ms:
          type: integer
        server_version:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          properties:
            tables_count:
              type: integer
            schema_name:
              type: string

    SchemaResponse:
      type: object
      properties:
        database_id:
          type: integer
        schema_name:
          type: string
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableSchema'
        views:
          type: array
          items:
            $ref: '#/components/schemas/TableSchema'
        last_synced_at:
          type: string
          format: date-time

    TableSchema:
      type: object
      properties:
        name:
          type: string
        schema:
          type: string
        type:
          type: string
          enum: [table, view, materialized_view]
        row_count:
          type: integer
          nullable: true
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
        indexes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              columns:
                type: array
                items:
                  type: string
              unique:
                type: boolean
        primary_key:
          type: array
          items:
            type: string

    ColumnInfo:
      type: object
      properties:
        name:
          type: string
        data_type:
          type: string
        nullable:
          type: boolean
        is_primary_key:
          type: boolean
        is_foreign_key:
          type: boolean
        foreign_key_reference:
          type: object
          nullable: true
          properties:
            table:
              type: string
            column:
              type: string
        default_value:
          type: string
          nullable: true
        max_length:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    SyncResult:
      type: object
      properties:
        database_id:
          type: integer
        status:
          type: string
          enum: [completed, failed, partial]
        tables_synced:
          type: integer
        columns_synced:
          type: integer
        duration_ms:
          type: integer
        errors:
          type: array
          items:
            type: string
        synced_at:
          type: string
          format: date-time

    # ============================================
    # PHASE 3: QUERY SCHEMAS
    # ============================================

    QueryRequest:
      type: object
      required: [database_id, natural_language]
      properties:
        database_id:
          type: integer
        natural_language:
          type: string
          example: "Show me the top 10 customers by revenue in the last quarter"
        conversation_id:
          type: integer
          nullable: true
        options:
          type: object
          properties:
            max_rows:
              type: integer
              minimum: 1
              maximum: 10000
              default: 100
            timeout_seconds:
              type: integer
              minimum: 5
              maximum: 300
              default: 30
            include_metadata:
              type: boolean
              default: false

    QueryResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, executing, completed, failed, cancelled]
        natural_language:
          type: string
        generated_sql:
          type: string
          nullable: true
        explanation:
          type: string
          nullable: true
        results:
          type: object
          nullable: true
          properties:
            columns:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
            row_count:
              type: integer
            execution_time_ms:
              type: integer
        suggested_visualizations:
          type: array
          items:
            $ref: '#/components/schemas/VisualizationSuggestion'
        tokens_used:
          type: integer
        conversation_id:
          type: integer
        parent_query_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    QueryListResponse:
      type: object
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/QueryResponse'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        pages:
          type: integer

    SQLExecutionRequest:
      type: object
      required: [database_id, sql]
      properties:
        database_id:
          type: integer
        sql:
          type: string
          example: "SELECT COUNT(*) FROM customers WHERE created_at > '2026-01-01'"
        timeout_seconds:
          type: integer
          default: 30

    FollowUpRequest:
      type: object
      required: [natural_language]
      properties:
        natural_language:
          type: string
          example: "What about last month?"

    VisualizationSuggestion:
      type: object
      properties:
        type:
          type: string
          enum: [bar_chart, line_chart, pie_chart, table, kpi, scatter_plot, area_chart, heatmap, histogram]
        title:
          type: string
        config:
          type: object

    # ============================================
    # PHASE 3: CONVERSATION SCHEMAS
    # ============================================

    ConversationResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        database_id:
          type: integer
          nullable: true
        context:
          type: object
        message_count:
          type: integer
        total_tokens:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ConversationResponse'
        total:
          type: integer

    ConversationMessageResponse:
      type: object
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        tool_calls:
          type: array
          nullable: true
          items:
            type: object
        tokens_used:
          type: integer
          nullable: true
        model_used:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "Show me total sales by region"

    # ============================================
    # PHASE 4: DASHBOARD SCHEMAS
    # ============================================

    DashboardRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: "Sales Performance Dashboard"
        description:
          type: string
        layout_config:
          type: object
          default: {"columns": 12, "rowHeight": 50}
        theme:
          type: string
          enum: [default, dark, light, custom]
          default: default
        is_template:
          type: boolean
          default: false
        is_public:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string

    DashboardResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        layout_config:
          type: object
        theme:
          type: string
        is_template:
          type: boolean
        is_public:
          type: boolean
        auto_generated:
          type: boolean
        refresh_interval:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DashboardListResponse:
      type: object
      properties:
        dashboards:
          type: array
          items:
            $ref: '#/components/schemas/DashboardResponse'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    AutoGenerateRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          example: "Sales performance dashboard with revenue trends and top products"
        database_id:
          type: integer
          nullable: true
        theme:
          type: string
          enum: [default, dark, light]
          default: default

    WidgetRequest:
      type: object
      required: [widget_type, title, query_id]
      properties:
        widget_type:
          type: string
          enum: [bar_chart, line_chart, pie_chart, table, kpi, scatter_plot, area_chart, heatmap, histogram]
        title:
          type: string
        query_id:
          type: integer
          nullable: true
        position_x:
          type: integer
          default: 0
        position_y:
          type: integer
          default: 0
        width:
          type: integer
          minimum: 1
          maximum: 12
          default: 6
        height:
          type: integer
          minimum: 1
          maximum: 20
          default: 4
        config:
          type: object
          default: {}
        refresh_interval:
          type: integer
          nullable: true

    WidgetResponse:
      type: object
      properties:
        id:
          type: integer
        dashboard_id:
          type: integer
        query_id:
          type: integer
          nullable: true
        widget_type:
          type: string
        title:
          type: string
        position_x:
          type: integer
        position_y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        config:
          type: object
        refresh_interval:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DashboardTemplateResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        preview_image:
          type: string
          nullable: true
        widget_count:
          type: integer
        usage_count:
          type: integer

    ShareRequest:
      type: object
      properties:
        is_public:
          type: boolean
        shared_with_user_ids:
          type: array
          items:
            type: integer
        share_link_enabled:
          type: boolean

    # ============================================
    # PHASE 5: VOICE SCHEMAS
    # ============================================

    TranscriptionRequest:
      type: object
      properties:
        language:
          type: string
          default: "en"
        model:
          type: string
          enum: [whisper-1, whisper-large-v3]
          default: whisper-1

    TranscriptionResponse:
      type: object
      properties:
        text:
          type: string
          example: "Show me total sales by region"
        language:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        duration_ms:
          type: integer
        segments:
          type: array
          items:
            type: object
            properties:
              start:
                type: number
              end:
                type: number
              text:
                type: string
              confidence:
                type: number

    SynthesisRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        voice_profile:
          type: string
          enum: [default, professional, friendly]
          default: default
        speed:
          type: number
          minimum: 0.5
          maximum: 2.0
          default: 1.0
        format:
          type: string
          enum: [mp3, wav, opus]
          default: mp3

    VoiceProfileResponse:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        language:
          type: string
        sample_rate:
          type: integer

    # ============================================
    # PHASE 6: ANOMALY SCHEMAS
    # ============================================

    AnomalyDetectRequest:
      type: object
      required: [database_id, table_name, column_name]
      properties:
        database_id:
          type: integer
        table_name:
          type: string
        column_name:
          type: string
        method:
          type: string
          enum: [isolation_forest, z_score, iqr, auto]
          default: auto
        sensitivity:
          type: number
          minimum: 0.1
          maximum: 5.0
          default: 3.0
        time_range:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        group_by:
          type: string
