    ConversationIdPath:
      name: conversation_id
      in: path
      required: true
      schema:
        type: integer
      description: Conversation ID

    RoleIdPath:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
      description: Role ID

    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
