services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-postgres
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agentic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: agentic-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    logging:
      driver: none

  backend:
    build: ./backend
    container_name: agentic-backend
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/agentic
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars-long!}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:3001"]'
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      APP_URL: http://localhost:8090
      # LLM Provider Configuration (auto detects OpenRouter / Grok / Local Proxy / Local LLM)
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_USE_MOCK: ${LLM_USE_MOCK:-false}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:3b}
      VLLM_API_URL: ${VLLM_API_URL:-http://ollama:11434/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # OpenRouter API (https://openrouter.ai)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      # Grok / xAI API (https://x.ai)
      GROK_API_KEY: ${GROK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-2-latest}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
      # Local Proxy / Custom OpenAI-compatible Proxy (LiteLLM, LocalAI, etc.)
      LOCAL_PROXY_URL: ${LOCAL_PROXY_URL:-}
      LOCAL_PROXY_API_KEY: ${LOCAL_PROXY_API_KEY:-}
      LOCAL_PROXY_MODEL: ${LOCAL_PROXY_MODEL:-}
      # OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-api-key-change-in-prod}
      MCP_ENABLED: "true"
      USE_MCP_TOOLS: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8090"

  ollama:
    image: ollama/ollama:0.5.12
    container_name: agentic-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "8001:11434"
    volumes:
      - ollama_cache:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: agentic-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8090
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  ollama_cache:
